name: Visual regression snapshot update

on: [pull_request]

permissions:
  contents: write

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 120000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        shell: bash
        env:
          DEBUG: pw:install,pw:download
        run: |
          set -euo pipefail
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          npx playwright --version
          echo "Playwright cache before install:"
          ls -lah ~/.cache/ms-playwright || true

          install_chromium() {
            timeout 12m npx playwright install chromium
          }

          if ! install_chromium; then
            echo "First install attempt failed or timed out. Cleaning partial Chromium download and retrying once..."
            rm -rf ~/.cache/ms-playwright/chromium-* || true
            install_chromium
          fi

          echo "Playwright cache after install:"
          ls -lah ~/.cache/ms-playwright || true
          npx playwright install --list

      - name: Start wp-env
        run: npm run wp-env start

      - name: Wait for wp-env to be ready
        run: npx wait-on http://localhost:8889

      - name: Run functional E2E tests
        run: npm run test:e2e
        continue-on-error: false

      - name: Update visual regression snapshots
        run: npm run test:screenshot:update

      - name: Commit and push updated snapshots
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: 'Update visual regression snapshots (committed automatically via Visual Regression workflow)'